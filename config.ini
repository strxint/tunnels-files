;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;; WARNING: Icons require font-hack-nerd, to be installed in your system ;;;

[colors]

;;;;;;;;;;; Variables order ;;;;;;;;;;;
; Black
; Black
; Green
; Peorple
; Ocean Blue
; Red
; White

background = #1A1B26
background-alt = #15161E
foreground = #C0CAF5
primary = #BB9AF7
arch = #7AA2F7
alert = #F7768E
disabled = #C0CAF5
ghost = #999999

[bar/example]
width = 100%
height = 22pt
radius = 4

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = ${colors.background}

padding-left = 0
padding-right = 1

module-margin = 1

separator =  
separator-foreground = ${colors.disabled}

font-0 = Hack Nerd Font:style=Bold:size=12;2

modules-left = xworkspaces
modules-right = pulseaudio xkeyboard memory cpu wlan eth date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

format-prefix = ""
format-prefix-foreground = ${colors.ghost}
format-prefix-padding = 2

; active

label-active = 󱢢
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

; occupied

label-occupied = 󱢢
label-occupied-background = ${colors.arch}
label-occupied-padding = 1

; urgent

label-urgent = 󱢢
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

; empty

label-empty = 󱢢
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = " "
label-muted-foreground = ${colors.alert}
label-muted-padding = 2

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

format-prefix = " "
format-prefix-foreground = ${colors.primary}
format-prefix-padding = 2
label-layout = %layout%
label-layout-foreground = ${colors.foreground}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-padding = 2
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-padding = 2
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 2
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = 󰌙 %{F#0B5394} %ifname%%{F-}
label-disconnected-foreground = ${colors.alert}
label-disconnected-padding = 2
label-connected-padding = 2

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#6E329F}󰌗 %{F#B45F06} %local_ip%%{F-}

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#6E329F}󰈀 %{F#B45F06} %local_ip%%{F-}

[module/date]
type = internal/date
interval = 2

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}
format-prefix = "󰭧 "
format-prefix-padding = 2
label-prefix-padding = 2
format-prefix-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
